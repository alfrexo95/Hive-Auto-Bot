name: Hive Infinite Bot

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *' # Se despierta 6 veces al día
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install beem
      
      - name: Ejecutar Súper Bot
        env:
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
        run: python hive_bot.py
        
      - name: Register Hive Bot in Predator Hub (optional)
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.INFRA_HUB_TOKEN }}
          HUB_URL: https://x402-api-wigc.onrender.com
        run: |
          if [ -z "${HUB_TOKEN:-}" ]; then echo "Hub registration skipped: token not configured"; exit 0; fi
          set -euo pipefail
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{"agent_id":"hive-auto-bot","platform":"github-actions","capabilities":["hive.post","hive.engage","content"]}' \
            "$HUB_URL/infra/agents/register"
          curl --silent --show-error --fail --max-time 15 \
            -H "Authorization: Bearer $HUB_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$HUB_URL/infra/agents/hive-auto-bot/heartbeat"

      - name: Guardar estado del bucle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: Avanzando en el bucle infinito"
          file_pattern: 'hive_state.json'
